<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GSB Fourth Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas with a thin HUD layer floating at the corners */
:root{
  --bg:#1a1411;
  --panel:rgba(26,20,17,.80);
  --ink:#f6efe6;
  --muted:#cdbba8;
  --accent:#e8702a;
  --line:rgba(255,255,255,.14);
  --font-ui:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-sign:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font-ui)}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none;outline:none}
.hud-left{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 240px));pointer-events:none}
.hud-zone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 9px;display:flex;flex-direction:column;gap:2px;
  backdrop-filter:blur(6px);pointer-events:none}
.finder{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(6px);pointer-events:auto;margin:0}
.finder label{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finder-row{display:flex;gap:6px}
.finder input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 15px var(--font-ui);padding:8px 10px}
.finder input::placeholder{color:rgba(205,187,168,.7)}
.finder input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.finder select{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 14px var(--font-ui);padding:8px 8px}
.finder select option{background:#2a211c;color:var(--ink)}
.finder select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease-out}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;font:700 14px var(--font-ui);padding:0 16px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);padding:7px 12px;font-weight:500;align-self:flex-start}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.msg{font-size:13px;color:#ffb08a;line-height:1.4}
.route{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-dest{font-weight:700;font-size:15px}
.route-sub{font-size:12px;color:var(--muted)}
.route-dist{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap}
.route-step{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3}
.turn{width:36px;height:36px;border-radius:9px;background:rgba(232,112,42,.18);display:grid;place-items:center;flex:none}
.turn svg{width:22px;height:22px;transition:transform .15s linear}
@media (prefers-reduced-motion:reduce){.turn svg{transition:none}}
.eyebrow{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#zone{font-size:15px;font-weight:500;line-height:1.25}
.mini-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;pointer-events:none}
#mini{display:block;width:200px;height:auto;border-radius:5px}
.mini-cap{font-family:var(--font-sign);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:5px 2px 0;display:flex;justify-content:space-between}
.mini-cap b{color:#e8473b;font-weight:600}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:none;max-width:calc(100vw - 32px)}
.hint span{white-space:nowrap}
kbd{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-right:4px}
.stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(26,20,17,.45);border:2px solid rgba(255,255,255,.25);touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(246,239,230,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.jump{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);background:var(--accent);color:#fff;font:700 15px var(--font-ui);touch-action:none}
.jump:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:640px){
  #mini{width:130px}
  .hud-left{width:calc(100vw - 175px)}
  #zone{font-size:13px}
}
.floorlink{color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px;pointer-events:auto;align-self:flex-start}
.floorlink:hover{color:var(--ink)}
</style>
</head>
<body>
<div id="game" aria-label="3D walkable model of the GSB fourth floor hallway by the escalators and the balcony"></div>
<div class="hud-left">
  <header class="hud-zone"><span class="eyebrow">McCombs · GSB Level 4</span><strong id="zone">Hallway · by the escalators</strong><a class="floorlink" href="index.html">Go to the 3rd floor</a></header>
  <form class="finder" id="finder" autocomplete="off">
    <label for="room">Find a room</label>
    <div class="finder-row"><input id="room" name="room" placeholder="4.100H, MPA, Ford, balcony" enterkeyhint="go"><button class="btn" type="submit">Go</button></div>
    <div class="msg" id="msg" role="status" hidden></div>
    <div class="route" id="route" hidden>
      <div class="route-head"><div><div class="route-dest" id="rdest">MPA Program Office</div><div class="route-sub" id="rsub">GSB 4.112CA</div></div><span class="route-dist" id="rdist">0 m</span></div>
      <div class="route-step"><span class="turn"><svg viewBox="0 0 24 24" id="rarrow" aria-hidden="true"><path id="rpath" d="M12 3l7 8h-4.5v10h-5V11H5z" fill="#e8702a"/></svg></span><span id="rstep" aria-live="polite">Follow the arrows on the floor</span></div>
      <button class="btn ghost" type="button" id="rcancel">End directions</button>
    </div>
  </form>
  <form class="finder" id="spawn" autocomplete="off">
    <label for="entrance">Jump to a spot</label>
    <div class="finder-row"><select id="entrance"></select><button class="btn" type="submit">Teleport</button></div>
  </form>
</div>
<div class="flash" id="flash"></div>
<div class="mini-wrap"><canvas id="mini" aria-label="Floor map with your position"></canvas><div class="mini-cap"><span>Level 4</span><b>● You</b></div></div>
<div class="hint" id="hint"><span><kbd>WASD</kbd>move</span><span><kbd>Drag</kbd>look</span><span><kbd>Space</kbd>jump</span><span><kbd>Shift</kbd>run</span><span><kbd>Scroll</kbd>zoom</span></div>
<div id="stick" class="stick" hidden><div class="knob" id="knob"></div></div>
<button id="jump" class="jump" type="button" hidden>Jump</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
"use strict";
// Coordinates are pixels on reference/4th-floor/gsb-fourth-floor-plan.png (north points right on that plan).
// X(px)/Z(px) convert to meters at 0.07 m per pixel. The corridor between the MPA office and the 4.100
// rooms is drawn narrower on the plan than it is in the photos, so the 4.100 block sits ~15 px further south.
const S=0.07, H=2.9;
const X=m=>(m-1300)*S, Z=m=>(m-980)*S;
const V=p=>[X(p[0]),Z(p[1])];

try{
  await Promise.race([
    Promise.all(['600 40px "Barlow Condensed"','700 40px "Barlow Condensed"','400 40px Rubik','700 40px Rubik'].map(f=>document.fonts.load(f))),
    new Promise(r=>setTimeout(r,2500))
  ]);
}catch(e){}

// ---------- renderer ----------
const wrap=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.domElement.tabIndex=0;
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb9d3e6);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.05,400);
const ANISO=renderer.capabilities.getMaxAnisotropy();

// ---------- helpers ----------
let seed=11;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
const std=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o));
const basic=(t,o)=>new THREE.MeshBasicMaterial(Object.assign({map:t},o||{}));
const colliders=[], camBlockers=[], segs=[];
function addCollider(x1,z1,x2,z2){colliders.push({minX:Math.min(x1,x2),maxX:Math.max(x1,x2),minZ:Math.min(z1,z2),maxZ:Math.max(z1,z2)})}
function box(mx1,my1,mx2,my2,y0,y1,mat,o={}){
  const x1=X(mx1),x2=X(mx2),z1=Z(my1),z2=Z(my2);
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),y1-y0,Math.abs(z2-z1)),mat);
  m.position.set((x1+x2)/2,(y0+y1)/2,(z1+z2)/2);scene.add(m);
  if(o.collide)addCollider(x1,z1,x2,z2);
  if(o.cam)camBlockers.push(m);
  return m;
}
function fitText(ctx,txt,max,size,weight,family){let s=size;do{ctx.font=`${weight} ${s}px ${family}`;s-=2}while(ctx.measureText(txt).width>max&&s>10);}
const SIGNF='"Barlow Condensed",sans-serif';
function inPoly(x,z,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,zi]=poly[i],[xj,zj]=poly[j];if((zi>z)!==(zj>z)&&x<(xj-xi)*(z-zi)/(zj-zi)+xi)c=!c}return c}
// A wall line from A to B (plan px). `toward` is any plan point on the side you look at it from.
// put() places an object whose local +z points out of the wall and local x runs along it.
function wall(A,B,toward){
  const a=V(A),b=V(B),dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz);let nx=-dz/L,nz=dx/L;
  const tw=V(toward),mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2;if((tw[0]-mx)*nx+(tw[1]-mz)*nz<0){nx=-nx;nz=-nz}
  return {a,b,L,nx,nz,rot:Math.atan2(nx,nz),
    at(t,out=0){return [a[0]+dx*t+nx*out,a[1]+dz*t+nz*out]},
    put(obj,t,y=0,out=0){const p=this.at(t,out);obj.position.set(p[0],y,p[1]);obj.rotation.y=this.rot;scene.add(obj);return obj}};
}
function plane(w,h,mat){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat)}
function grp(){return new THREE.Group()}
function B(g,w,h,d,x,y,z,m){const k=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);k.position.set(x,y,z);g.add(k);return k}

// ---------- textures ----------
// polished terrazzo: mauve-brown with white, grey and black chips, dark divider strips on a diagonal grid
const [tc,tx]=cvs(1024,1024);
tx.fillStyle='#5d4a47';tx.fillRect(0,0,1024,1024);
for(let i=0;i<2400;i++){tx.fillStyle=`rgba(${110+rnd()*50|0},${80+rnd()*40|0},${80+rnd()*35|0},.22)`;tx.beginPath();tx.arc(rnd()*1024,rnd()*1024,4+rnd()*14,0,7);tx.fill()}
const chips=['#e9e1d6','#b9a69b','#231a18','#7e5f59','#3f2f2c','#a68a80','#2b2523','#7a7774','#946d63'];
for(let i=0;i<38000;i++){tx.fillStyle=chips[rnd()*chips.length|0];const s=.7+rnd()*2.4;tx.fillRect(rnd()*1024,rnd()*1024,s,s*(.6+rnd()*.8))}
tx.fillStyle='#1c1614';tx.fillRect(0,0,1024,4);tx.fillRect(0,0,4,1024);
const floorTex=tex(tc,true);floorTex.repeat.set(1/3.6,1/3.6);floorTex.rotation=Math.PI/4;

// 2x4 acoustic ceiling tiles (texture covers 1.2 x 1.2 m: two 0.6 x 1.2 tiles)
const [cc,cx]=cvs(256,256);
cx.fillStyle='#ebe8e1';cx.fillRect(0,0,256,256);
for(let i=0;i<3200;i++){cx.fillStyle=`rgba(110,104,95,${.08+rnd()*.2})`;const w=1+rnd()*3;cx.fillRect(rnd()*256,rnd()*256,w,1+rnd()*1.2)}
cx.fillStyle='#cfcac0';cx.fillRect(0,0,3,256);cx.fillRect(128,0,3,256);cx.fillRect(0,0,256,3);
const ceilTex=tex(cc,true);ceilTex.repeat.set(1/1.2,1/1.2);

// diagonal wood paneling (the wall beside the escalators)
const [wc,wx]=cvs(512,512);
wx.fillStyle='#a8692e';wx.fillRect(0,0,512,512);
wx.save();wx.translate(256,256);wx.rotate(-0.62);
for(let y=-520;y<520;){const h=16+rnd()*18;wx.fillStyle=['#b4773a','#9c602a','#bd8243','#a56a31','#ad7036'][rnd()*5|0];wx.fillRect(-520,y,1040,h);wx.fillStyle='rgba(60,30,8,.4)';wx.fillRect(-520,y,1040,1.4);y+=h}
for(let i=0;i<500;i++){wx.fillStyle=`rgba(70,35,10,${rnd()*.12})`;wx.fillRect(-520+rnd()*1040,-520+rnd()*1040,40+rnd()*120,1)}
wx.restore();
const woodTex=tex(wc,true);

// light oak (MPA portal, Ford Career Center counter)
const [oc,ox]=cvs(256,256);
ox.fillStyle='#c39058';ox.fillRect(0,0,256,256);
for(let i=0;i<220;i++){ox.fillStyle=`rgba(${120+rnd()*40|0},${70+rnd()*30|0},30,${rnd()*.25})`;ox.fillRect(rnd()*256,0,1+rnd()*3,256)}
const oakTex=tex(oc,true);

// orange-brown laminate door leaf
function leafTex(base){
  const [c,x]=cvs(128,256);x.fillStyle=base||'#a5642f';x.fillRect(0,0,128,256);
  for(let i=0;i<2600;i++){x.fillStyle=`rgba(${rnd()<.5?60:200},${rnd()<.5?30:120},${rnd()<.5?10:60},${rnd()*.18})`;x.fillRect(rnd()*128,rnd()*256,1+rnd()*3,1+rnd()*3)}
  return tex(c);
}
const doorTex=leafTex();
const stairDoorTex=leafTex('#c79a55');

// board-formed concrete (balcony parapet)
const [kc,kx]=cvs(512,128);
kx.fillStyle='#cfccc4';kx.fillRect(0,0,512,128);
for(let y=0;y<128;y+=16){kx.fillStyle=`rgba(90,88,80,${.08+rnd()*.1})`;kx.fillRect(0,y,512,1.5);for(let i=0;i<40;i++){kx.fillStyle=`rgba(255,255,255,${rnd()*.15})`;kx.fillRect(rnd()*512,y+rnd()*16,20+rnd()*60,1)}}
for(let i=0;i<3000;i++){kx.fillStyle=`rgba(70,70,64,${rnd()*.15})`;kx.fillRect(rnd()*512,rnd()*128,1.5,1.5)}
const concTex=tex(kc,true);

// tan concrete pavers (balcony floor)
const [pc,px]=cvs(256,256);
px.fillStyle='#b9ab95';px.fillRect(0,0,256,256);
for(let r=0;r<8;r++)for(let k=0;k<4;k++){const o=(r%2)*32;px.fillStyle=`hsl(${32+rnd()*8},${16+rnd()*10}%,${58+rnd()*10}%)`;px.fillRect((k*64+o)%256+1,r*32+1,62,30);if(k===3&&o){px.fillRect(1,r*32+1,30,30)}}
for(let i=0;i<4000;i++){px.fillStyle=`rgba(60,50,40,${rnd()*.15})`;px.fillRect(rnd()*256,rnd()*256,1.5,1.5)}
const paverTex=tex(pc,true);paverTex.repeat.set(1/2.4,1/2.4);

function plaqueTex(top,sub,w=256,h=140){
  const [c,x]=cvs(w,h);x.fillStyle='#17191b';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.textBaseline='middle';
  fitText(x,top,w-28,sub?50:58,700,SIGNF);x.fillText(top,14,sub?48:h/2);
  if(sub){x.fillStyle='#c9cbcd';fitText(x,sub,w-28,26,500,SIGNF);x.fillText(sub,14,104)}
  return tex(c);
}
function hangTex(lines,o={}){
  const w=o.w||1024,h=o.h||220,[c,x]=cvs(w,h);
  x.fillStyle='#232528';x.fillRect(0,0,w,h);x.fillStyle='#f3f1ec';x.fillRect(8,8,w-16,h-16);x.fillStyle='#232528';
  x.textBaseline='middle';
  if(o.split){
    x.fillRect(w/2-2,30,4,h-60);
    const L=o.split[0],R=o.split[1];
    x.font=`700 46px ${SIGNF}`;x.fillText('←',28,46);
    L.forEach((t,i)=>{x.font=`500 34px ${SIGNF}`;x.fillText(t,86,46+i*40)});
    x.font=`700 46px ${SIGNF}`;x.textAlign='right';x.fillText('→',w-28,46);
    R.forEach((t,i)=>{x.font=`500 34px ${SIGNF}`;x.fillText(t,w-86,46+i*40)});
  }else{
    x.textAlign='center';lines.forEach((t,i)=>{fitText(x,t,w-60,o.size||64,500,SIGNF);x.fillText(t,w/2,h/2+(i-(lines.length-1)/2)*(o.size||64)*1.1)});
  }
  return tex(c);
}

// ---------- materials ----------
const M={
  wall:std({color:0xece4d3,roughness:.92}),
  floor:std({map:floorTex,roughness:.2}),
  ceil:std({map:ceilTex,roughness:1}),
  base:std({color:0x161616,roughness:.6}),
  steel:std({color:0xb7babd,roughness:.35,metalness:.7}),
  brushed:std({color:0xa9adb1,roughness:.42,metalness:.75}),
  dark:std({color:0x2a2d30,roughness:.6}),
  black:std({color:0x141414,roughness:.4}),
  bronze:std({color:0x2b2622,roughness:.45,metalness:.4}),
  glass:new THREE.MeshStandardMaterial({color:0xd6ebf2,transparent:true,opacity:.16,roughness:.05,metalness:.2,side:THREE.DoubleSide,depthWrite:false}),
  red:std({color:0xb3221c,roughness:.5}),
  light:new THREE.MeshBasicMaterial({color:0xfffdf3}),
  pit:std({color:0x8a7f76,roughness:.9}),
  wood:std({map:woodTex,roughness:.6}),
  oak:std({map:oakTex,roughness:.55}),
  oakDark:std({color:0x8a5a2e,roughness:.5}),
  door:std({map:doorTex,roughness:.6}),
  stairDoor:std({map:stairDoorTex,roughness:.6}),
  carpet:std({color:0x47505a,roughness:1}),
  conc:std({map:concTex,roughness:.95}),
  locker:std({color:0x3c3f43,roughness:.55,metalness:.3}),
};

// ---------- floor plan (plan px) ----------
const PIT=[1060,1007,1210,1047];
const INTERIOR=[[780,850],[1430,850],[1600,1020],[1600,1150],[780,1150]];   // NE edge = the balcony glass line (x - y = 580)
function shapeOf(pts,flip){const s=new THREE.Shape();pts.forEach((p,i)=>{const x=X(p[0]),z=flip?Z(p[1]):-Z(p[1]);i?s.lineTo(x,z):s.moveTo(x,z)});return s}
{
  const fs=shapeOf(INTERIOR);const h=new THREE.Path();[[PIT[0],PIT[1]],[PIT[2],PIT[1]],[PIT[2],PIT[3]],[PIT[0],PIT[3]]].forEach((p,i)=>i?h.lineTo(X(p[0]),-Z(p[1])):h.moveTo(X(p[0]),-Z(p[1])));fs.holes.push(h);
  const fg=new THREE.ShapeGeometry(fs);fg.rotateX(-Math.PI/2);scene.add(new THREE.Mesh(fg,M.floor));
  const cg=new THREE.ShapeGeometry(shapeOf(INTERIOR,true));cg.rotateX(Math.PI/2);cg.translate(0,H,0);scene.add(new THREE.Mesh(cg,M.ceil));

  const sv=[false,...NODES.map(nd=>los(start,nd))];
  const edge=(i,j)=>{if(i===j)return false;if(i===0||j===0){const k=i===0?j:i;return k===G?false:sv[k]}if(i===G||j===G){const k=i===G?j:i;return !!nav.goalVis[k]}return NL[i-1][j-1]};
  const d=new Array(n).fill(Infinity),prev=new Array(n).fill(-1),done=new Array(n).fill(false);d[0]=0;
  for(let it=0;it<n;it++){let u=-1;for(let i=0;i<n;i++)if(!done[i]&&(u<0||d[i]<d[u]))u=i;if(u<0||d[u]===Infinity)break;done[u]=true;if(u===G)break;
    for(let v=0;v<n;v++){if(done[v]||!edge(u,v))continue;const nd=d[u]+Math.hypot(pts[u][0]-pts[v][0],pts[u][1]-pts[v][1]);if(nd<d[v]){d[v]=nd;prev[v]=u}}}
  if(d[G]===Infinity)return [start,goal];
  const out=[];for(let v=G;v!==-1;v=prev[v])out.unshift(pts[v]);
  const sm=[out[0]];let i=0;while(i<out.length-1){let j=out.length-1;while(j>i+1&&!los(out[i],out[j]))j--;sm.push(out[j]);i=j}
  return sm;
}

const $=id=>document.getElementById(id);
const form=$('finder'),input=$('room'),msg=$('msg'),route=$('route');
const norm=v=>v.toLowerCase().replace(/[^0-9a-z]/g,'').replace(/^(gsb|room|rm)/,'');
function say(t){msg.textContent=t;msg.hidden=false}
function stopNav(){nav.active=false;nav.arrived=false;route.hidden=true;beacon.visible=false;for(const c of chevs)c.visible=false}
function startNav(R,note){
  nav.active=true;nav.arrived=false;nav.room=R;nav.goal=[X(R.dest[0]),Z(R.dest[1])];nav.lastCalc=-1;
  nav.goalVis=[false,...NODES.map(nd=>los(nd,nav.goal))];
  if(note)say(note);else msg.hidden=true;
  route.hidden=false;
  $('rdest').textContent=R.name;$('rsub').textContent=R.full;$('rcancel').textContent='End directions';$('rpath').setAttribute('d',ARROW);
  drawTag(R.tag);beacon.position.set(X(R.beacon[0]),0,Z(R.beacon[1]));beacon.visible=true;
}
form.addEventListener('submit',e=>{
  e.preventDefault();const raw=input.value.trim();let v=norm(raw);
  if(!v){say('Type a room like 4.100H, or MPA, Ford, NRG, balcony.');return}
  v=ALIAS[v]||v;
  if(ROOM_DB[v]){startNav(ROOM_DB[v]);input.blur();el.focus();return}
  const pretty=/^\d{4}/.test(v)?v.replace(/^(\d)(\d{3})/,'$1.$2').toUpperCase():raw;
  if(/^43\d\d[a-z]?$/.test(v)){startNav(ROOM_DB.cba,`${pretty} is a classroom in the CBA wing, which isn't built yet. Taking you to the CBA doors it's behind.`);input.blur();el.focus();return}
  stopNav();
  if(/^4\d{3}[a-z]{0,2}$/.test(v))say(`${pretty} isn't mapped yet. Try 4.100H, MPA, Ford, NRG, AIM, 4.128 or balcony.`);
  else say(`"${raw}" doesn't look like a 4th-floor room. Try 4.100H, MPA, Ford, NRG, AIM, 4.128 or balcony.`);
});
$('rcancel').addEventListener('click',()=>{stopNav();el.focus()});

const ENTRANCES=[
  {id:'mpa',name:'MPA Program Office · toward the escalators',pos:[1340,966],look:[1100,985]},
  {id:'esc',name:'Top of the escalators',pos:[1240,1028],look:[1400,966]},
  {id:'balcony',name:'Balcony doors',pos:[1466,952],look:[1512,906]},
  {id:'hall100',name:'4.100 rooms · by the lactation room',pos:[1494,966],look:[1300,966]},
  {id:'stair',name:'Stair 2',pos:[1533,994],look:[1533,1065]},
  {id:'elev',name:'Elevators · NRG Productivity Center',pos:[960,1020],look:[880,960]},
  {id:'ford',name:'Inside the Ford Career Center',pos:[1030,935],look:[1030,870]},
  {id:'cba',name:'CBA passage',pos:[1316,1108],look:[1316,990]},
];
const entSel=$('entrance');ENTRANCES.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;entSel.appendChild(o)});
function place(pos,lk){
  P.x=X(pos[0]);P.z=Z(pos[1]);P.y=0;P.vy=0;P.grounded=true;
  const fx=X(lk[0])-P.x,fz=Z(lk[1])-P.z;P.face=Math.atan2(fx,fz);yaw=Math.atan2(-fx,-fz);pitch=.28;camDist=dist;camY=1.45;
}
function teleport(id){
  const E=ENTRANCES.find(e=>e.id===id);if(!E)return;place(E.pos,E.look);
  nav.lastCalc=-1;if(nav.arrived){nav.arrived=false;startNav(nav.room)}
  const f=$('flash');f.style.transition='none';f.style.opacity='.85';requestAnimationFrame(()=>{f.style.transition='';f.style.opacity='0'});
}
$('spawn').addEventListener('submit',e=>{e.preventDefault();teleport(entSel.value);el.focus()});

const ARROW='M12 3l7 8h-4.5v10h-5V11H5z',CHECK='M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 11-11-1.4-1.4z';
function updateNav(){
  if(!nav.active)return;
  const t=clock.elapsedTime;
  const r=beacon.userData.ring;const pulse=1+.18*Math.sin(t*4);r.scale.set(pulse,pulse,1);r.material.opacity=.55+.3*Math.sin(t*4);
  beacon.userData.sp.position.y=2.05+Math.sin(t*2.2)*.05;
  if(nav.arrived)return;
  if(Math.hypot(P.x-nav.goal[0],P.z-nav.goal[1])<1.25){
    nav.arrived=true;for(const c of chevs)c.visible=false;
    $('rdist').textContent='Here';$('rstep').textContent=`You've arrived at ${nav.room.name}.`;$('rpath').setAttribute('d',CHECK);$('rarrow').style.transform='none';$('rcancel').textContent='Done';
    return;
  }
  if(nav.lastCalc<0||t-nav.lastCalc>.15){nav.path=findPath([P.x,P.z],nav.goal);nav.lastCalc=t}
  const path=nav.path;path[0]=[P.x,P.z];
  let len=0;const seg=[];for(let i=1;i<path.length;i++){const l=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);seg.push(l);len+=l}
  nav.len=len;
  const gap=.95,start=1.0,end=len-.5,flow=(t*1.3)%gap;let ci=0;
  for(let s=start+flow;s<end&&ci<chevs.length;s+=gap){
    let acc=0,k=0;while(k<seg.length-1&&acc+seg[k]<s){acc+=seg[k];k++}
    const u=Math.min(1,(s-acc)/seg[k]),a=path[k],b=path[k+1],dx=b[0]-a[0],dz=b[1]-a[1];
    const c=chevs[ci++];c.visible=true;c.position.set(a[0]+dx*u,.025,a[1]+dz*u);c.rotation.y=Math.atan2(-dz,dx);
    c.material.opacity=Math.min(1,(s-start)/1.0+.2,(end-s)/1.0+.35);
  }
  for(;ci<chevs.length;ci++)chevs[ci].visible=false;
  let ni=1;while(ni<path.length-1&&Math.hypot(path[ni][0]-P.x,path[ni][1]-P.z)<1.5)ni++;
  const nx=path[ni][0]-P.x,nz=path[ni][1]-P.z;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const ang=Math.atan2(nx*rx+nz*rz,nx*fx+nz*fz);
  $('rarrow').style.transform=`rotate(${ang*180/Math.PI}deg)`;$('rpath').setAttribute('d',ARROW);
  const toTurn=Math.max(1,Math.round(Math.hypot(nx,nz)));
  const last=ni===path.length-1;
  let step;
  if(Math.abs(ang)>2.4)step='Turn around';
  else if(last)step=Math.abs(ang)<.45?`${nav.room.say} straight ahead`:`${nav.room.say} on your ${ang>0?'right':'left'}`;
  else if(Math.abs(ang)<.45)step=`Go straight for ${toTurn} m`;
  else step=`Turn ${ang>0?'right':'left'}, then go ${toTurn} m`;
  $('rstep').textContent=step;$('rdist').textContent=`${Math.max(1,Math.round(len))} m`;
}

// ---------- loop ----------
const clock=new THREE.Clock();const ray=new THREE.Raycaster();const tgt=new THREE.Vector3(),dirV=new THREE.Vector3();
let camY=1.45;
function angLerp(a,b,t){const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}
function animLimbs(av,phase,amp,air){const s=Math.sin(phase)*amp;av.legL.rotation.x=s*.8;av.legR.rotation.x=-s*.8;av.armL.rotation.x=air?-2.6:-s*.8;av.armR.rotation.x=air?-2.6:s*.8}
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
  let r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  const mag=Math.min(1,Math.hypot(f,r));
  const run=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>.95);
  const sp=(run?7.2:4.2)*mag;
  if(mag>.05){
    const n=Math.hypot(f,r);f/=n;r/=n;
    const vx=-Math.sin(yaw)*f+Math.cos(yaw)*r, vz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
    moveP(vx*sp*dt,vz*sp*dt);
    P.face=angLerp(P.face,Math.atan2(vx,vz),Math.min(1,dt*12));
  }
  if((keys.Space||jumpQueued)&&P.grounded){P.vy=6.6;P.grounded=false}
  jumpQueued=false;
  P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.grounded=true}
  P.amp+=((mag>.05?1:0)-P.amp)*Math.min(1,dt*10);P.phase+=dt*(run?13:9)*Math.max(mag,.2);
  player.g.position.set(P.x,P.y,P.z);player.g.rotation.y=P.face;
  player.sh.position.set(P.x,.015,P.z);player.sh.scale.setScalar(1-Math.min(P.y,1.5)*.3);
  animLimbs(player,P.phase,P.amp,!P.grounded);
  updateWalkers(dt);
  s2.head.rotation.y=.5+Math.sin(clock.elapsedTime*.5)*.2;sitter.head.rotation.y=Math.sin(clock.elapsedTime*.4)*.15;
  for(const s of stepTexes)s.t.offset.y=(s.t.offset.y+s.dir*dt*.6)%1;
  camY+=((P.y+1.45)-camY)*Math.min(1,dt*10);
  tgt.set(P.x,camY,P.z);
  dirV.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).normalize();
  ray.set(tgt,dirV);ray.far=dist+.3;
  const hits=ray.intersectObjects(camBlockers,false);
  const want=hits.length?Math.max(.45,Math.min(dist,hits[0].distance-.3)):dist;
  camDist=want<camDist?want:camDist+(want-camDist)*Math.min(1,dt*4);
  camera.position.copy(tgt).addScaledVector(dirV,camDist);
  camera.position.y=Math.min(H-.12,Math.max(.25,camera.position.y));
  camera.lookAt(tgt);
  player.g.visible=camDist>.75;
  const zn=zoneAt();if(zn!==lastZone){lastZone=zn;zoneEl.textContent=zn}
  updateNav();
  drawMini();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
window.__floor4={place:(p,l,pi,d)=>{place(p,l);if(pi!==undefined)pitch=pi;if(d!==undefined){dist=d;camDist=d}},P,nav,findPath,X,Z};
el.focus();
tick();
})();
