<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>McCombs Fifth Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#1a1411;--panel:rgba(26,20,17,.80);--ink:#f6efe6;--muted:#cdbba8;--accent:#e8702a;--line:rgba(255,255,255,.14);
  --font-ui:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-sign:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font-ui)}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none;outline:none}
.hud-left{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 240px));pointer-events:none}
.hud-zone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 9px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(6px);pointer-events:none}
.finder{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(6px);pointer-events:auto;margin:0}
.finder label{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finder-row{display:flex;gap:6px}
.finder input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 15px var(--font-ui);padding:8px 10px}
.finder input::placeholder{color:rgba(205,187,168,.7)}
.finder input:focus-visible,.finder select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.finder select{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 14px var(--font-ui);padding:8px 8px}
.finder select option{background:#2a211c;color:var(--ink)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease-out}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;font:700 14px var(--font-ui);padding:0 16px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);padding:7px 12px;font-weight:500;align-self:flex-start}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.msg{font-size:13px;color:#ffb08a;line-height:1.4}
.route{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-dest{font-weight:700;font-size:15px}
.route-sub{font-size:12px;color:var(--muted)}
.route-dist{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap}
.route-step{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3}
.turn{width:36px;height:36px;border-radius:9px;background:rgba(232,112,42,.18);display:grid;place-items:center;flex:none}
.turn svg{width:22px;height:22px;transition:transform .15s linear}
@media (prefers-reduced-motion:reduce){.turn svg{transition:none}}
.eyebrow{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#zone{font-size:15px;font-weight:500;line-height:1.25}
.floors{font-size:12px;color:var(--muted);pointer-events:auto}
.floors a{color:var(--accent);text-decoration:none;font-weight:600}
.mini-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;pointer-events:auto;cursor:zoom-in}
.mini-wrap.big{top:50%;right:auto;left:50%;transform:translate(-50%,-50%);z-index:20;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.mini-wrap.big #mini{width:min(900px,92vw,calc(88vh * 900 / 860))}
.mini-wrap{touch-action:none;user-select:none}
#mini{display:block;width:300px;height:auto;border-radius:5px}
.mini-cap{font-family:var(--font-sign);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:5px 2px 0;display:flex;justify-content:space-between}
.mini-cap b{color:#e8473b;font-weight:600}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:none;max-width:calc(100vw - 32px)}
.hint span{white-space:nowrap}
kbd{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-right:4px}
.stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(26,20,17,.45);border:2px solid rgba(255,255,255,.25);touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(246,239,230,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.jump{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:var(--accent);color:#fff;font:700 15px var(--font-ui);touch-action:none}
@media (max-width:640px){#mini{width:190px}.hud-left{width:calc(100vw - 185px)}#zone{font-size:13px}}
</style>
</head>
<body>
<div id="game" aria-label="3D walkable model of the GSB and CBA fifth floor, atrium overlook and classroom corridors"></div>
<div class="hud-left">
  <header class="hud-zone"><span class="eyebrow">McCombs · GSB / CBA Level 5</span><strong id="zone">Escalators</strong></header>
  <form class="finder" id="finder" autocomplete="off">
    <label for="room">Find a room</label>
    <div class="finder-row"><input id="room" name="room" placeholder="5.142, printer, elevator, CBA" enterkeyhint="go"><button class="btn" type="submit">Go</button></div>
    <div class="msg" id="msg" role="status" hidden></div>
    <div class="route" id="route" hidden>
      <div class="route-head"><div><div class="route-dest" id="rdest"></div><div class="route-sub" id="rsub"></div></div><span class="route-dist" id="rdist">0 m</span></div>
      <div class="route-step"><span class="turn"><svg viewBox="0 0 24 24" id="rarrow" aria-hidden="true"><path id="rpath" d="M12 3l7 8h-4.5v10h-5V11H5z" fill="#e8702a"/></svg></span><span id="rstep" aria-live="polite">Follow the arrows on the floor</span></div>
      <button class="btn ghost" type="button" id="rcancel">End directions</button>
    </div>
  </form>
  <form class="finder" id="spawn" autocomplete="off">
    <label for="entrance">Start at</label>
    <div class="finder-row"><select id="entrance"></select><button class="btn" type="submit">Teleport</button></div>
  </form>
  <nav class="floors" aria-label="Floor selection">Floor <a href="index.html">3rd</a> · <b aria-current="page">5th (preview)</b></nav>
</div>
<div class="flash" id="flash"></div>
<div class="mini-wrap" id="miniwrap" title="Click to enlarge the map"><canvas id="mini" aria-label="Floor map with your position and room numbers"></canvas><div class="mini-cap"><span>Level 5 · click for the whole floor</span><b style="color:#59a9ff">● You (live)</b></div></div>
<div class="hint" id="hint"><span><kbd>WASD</kbd>move</span><span><kbd>Drag</kbd>look</span><span><kbd>Space</kbd>jump</span><span><kbd>Shift</kbd>run</span><span><kbd>Scroll</kbd>zoom</span></div>
<div id="stick" class="stick" hidden><div class="knob" id="knob"></div></div>
<button id="jump" class="jump" type="button" hidden>Jump</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
"use strict";
/* Level 5 (GSB). Coordinates are pixels of the GSB Fifth Floor plan image (1760 px wide).
   Plan pixel -> meters: S m per px. x grows east, y grows south. */
const S=0.07, H=2.9, K=S*100;                // meters per plan pixel (0.055 and 0.045 were both too small; calibrated from the elevator/stair plan crop); K = canvas px per plan px
const X=m=>(m-1000)*S; let Z=m=>(m-800)*S;
// The front door lines up with the west escalator approach on the printed plan.
 const C142={west:865,east:1127,roomEast:1027,front:700,door:964,jamb:8,partition:654,insideWidth:30};
 const SEATING_PRINTER={desk:[1284.5,628.25],approach:[1284.5,645]};
 const PHD_LOUNGE={front:1117,back:1242,start:1045,end:1172,door:1091,halfDoor:8};
 const CBA_CLASSROOM_BAYS=[
  {wall:310,y:1100,label:'5.322'},{wall:310,y:1270,label:'5.328'},
  {wall:354,y:1320,label:'5.330'},{wall:354,y:1408,label:'5.338'},
  {wall:310,y:1408,label:'Testing Center'}
 ];
 const CLASSROOM_BAY_HALF=12;
 // The west wall runs continuously from the 5.102–5.112 bays into the Finance Centers hallway.
 const WEST_CORRIDOR_WALL=706;
 const FINANCE_HALL={
  west:WEST_CORRIDOR_WALL,
  east:WEST_CORRIDOR_WALL+51,
  center:WEST_CORRIDOR_WALL+25.5,
  alcoveBack:WEST_CORRIDOR_WALL+83
 };
 // Model coordinates for the west leg and the 5.176K/J passage shown on the floor plan.
 const FINANCE_WEST={
  upper:273,lower:302,bend:652,mural:700,landing:306,threshold:600,
  branchLeft:542,branchRight:571,branchTop:182,returnBottom:209,
  officeA:252,loopWest:267,loopEast:309,stairsWest:224,stairsNorth:252,
  returnRecessLeft:322,returnRecessRight:342,returnRecessBack:310
 };
 const FINANCE_WEST_NODES=[
  [724,331],[710,331],[677,307],[646,287.5],[609,287.5],[556.5,287.5],[525,287.5],[292,287.5],
  [556.5,260],[556.5,229],[556.5,195.5],[470,195.5],
  [371,195.5],[339,203],[274,204],[325,230],[306,251],[289,272],[249,287.5],[245,266]
 ];
 // Door centers and hinge ends traced from the plan, in corridor-facing order.
 // The plan has a second entrance to G and a separate storage door at the end of the alcove.
 const OFFICE_176_DOORS=[
  {room:'AA',center:[252,204],map:[236.5,85],face:'e',hinge:-1},
  {room:'A',center:[274,218],map:[247,96],face:'n',hinge:1,lite:true},
  {room:'B',center:[274,190],map:[252,79],face:'s',hinge:1},
  {room:'C',center:[293,190],map:[267,79],face:'s',hinge:-1,lite:true},
  {room:'D',center:[383,182],map:[333.5,74],face:'s',hinge:1,lite:true},
  {room:'E',center:[401,182],map:[347,74],face:'s',hinge:-1},
  {room:'F',center:[504,182],map:[419.5,74],face:'s',hinge:1},
  {room:'G',center:[521,182],map:[432,74],face:'s',hinge:-1,lite:true},
  {room:'G',center:[559,182],map:[460,74],face:'s',hinge:1,lite:true,secondary:true},
  {room:'H',center:[571,190.4],map:[468.5,79.5],face:'w',hinge:1},
  {room:'J',center:[571,206.7],map:[468.5,90.5],face:'w',hinge:-1,lite:true},
  {room:'K',center:[513,209],map:[421,90],face:'n',hinge:1},
  {room:'L',center:[494,209],map:[409,90],face:'n',hinge:-1,lite:true},
  {room:'M',center:[401,209],map:[344,90],face:'n',hinge:1},
  {room:'N',center:[355.2,214.08],map:[320,93],face:'nw',hinge:-1,lite:true}
 ];
 const OFFICE_176_NORMAL={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0],nw:[-54/Math.hypot(54,51),-51/Math.hypot(54,51)]};
 function office176Point(door,distance){
  const [nx,nz]=OFFICE_176_NORMAL[door.face], [x,z]=door.center;
  return [x+nx*distance,z+nz*distance];
 }
 const CLASSROOM_BEND={
  officeEnd:979,southCorner:1056,office136Start:397,carpetEdge:[[1085,373],[1134,348.625]],
  northTurn:[1011,241],southHall:[1161,454],room153:[1001,250.3]
 };
 // Coordinates relative to the end of the 5.154 frontage. Positive depth runs
 // into the alcove, perpendicular to the diagonal corridor.
 const CLASSROOM_ALCOVE_ORIGIN=[1138,352.125],ALCOVE_UNIT=Math.hypot(8,7);
 function classroomAlcovePoint(run,depth){
  return [CLASSROOM_ALCOVE_ORIGIN[0]+(8*run+7*depth)/ALCOVE_UNIT,
          CLASSROOM_ALCOVE_ORIGIN[1]+(7*run-8*depth)/ALCOVE_UNIT];
 }
 const alcoveP=classroomAlcovePoint;
 const PEGGY_NORTH=622;
 const EAST_GALLERY={north:-5,south:-35,center:-20,outer:70,start:111,endDoor:368};
 function galleryEndRun(depth){
  return ((PEGGY_NORTH-CLASSROOM_ALCOVE_ORIGIN[1])*ALCOVE_UNIT+8*depth)/7;
 }
 const galleryEnd=depth=>alcoveP(galleryEndRun(depth),depth);
 const galleryLoungeEntry=galleryEnd(EAST_GALLERY.center);
 const CLASSROOM_ALCOVE_EDGE=[
  ...[[0,0],[0,22],[47,22],[47,57],[68,57],[68,0],[107,0],
      [EAST_GALLERY.start,EAST_GALLERY.north]].map(([u,v])=>alcoveP(u,v)),
  ...[EAST_GALLERY.north,EAST_GALLERY.south].map(depth=>[galleryEnd(depth)[0],PEGGY_NORTH+.35]),
  alcoveP(108,EAST_GALLERY.south)
 ];
 const CLASSROOM_ALCOVE_DOORS=[
  {number:'5.154',tag:'Seminar Room',door:[0,10.5],approach:[11,8]},
  {number:'5.155',tag:'Office',door:[47,39],approach:[57,39]},
  {number:'5.156',tag:'Office',door:[57.5,57],approach:[57.5,45]},
  {number:'5.157',tag:'Office',door:[68,10.5],approach:[56,10.5]}
 ];
 function classroomAlcoveMap(u,v){return [824.5+.63*(u+v),191.5+.63*(u-v)];}
 // Each row lists the partition and the door center, ordered toward Peggy.
 const GALLERY_OFFICES=[
  {depth:EAST_GALLERY.north,rooms:[
   ['5.158',EAST_GALLERY.start,152],['5.159',161,172],['5.162',209,245],
   ['5.163',254,265],['5.165',302,312],['5.167',349,358]
  ]},
  {depth:EAST_GALLERY.south,rooms:[
   ['5.160',108,194],['5.161',203,214],['5.164',254,275],['5.166',316,334]
  ]}
 ];
 const galleryApproach=(u,v)=>alcoveP(u,THREE.MathUtils.lerp(v,EAST_GALLERY.center,.73));
 function galleryMap(u,v){return [880.2+.515*(u-111)+.455*(v+5),270.8+.515*(u-111)-.475*(v+5)];}
 const BOUNDS={x1:145,y1:250,x2:1560,y2:1545};
const PIT=[971,784,1187,822];                 // escalator opening (opposing upper landings); hugs the men's-restroom wood wall

try{await Promise.race([Promise.all(['600 40px "Barlow Condensed"','700 40px "Barlow Condensed"','400 40px Rubik','700 40px Rubik'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))])}catch(e){}

// ---------- renderer ----------
const wrap=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.domElement.tabIndex=0;
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd8d2c8);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.05,200);
const ANISO=renderer.capabilities.getMaxAnisotropy();

// ---------- helpers ----------
let seed=11;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function cvs(w,h){const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return [c,c.getContext('2d')]}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
const std=o=>new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o));
const colliders=[],camBlockers=[],segs=[];
function addCollider(x1,z1,x2,z2){colliders.push({minX:Math.min(x1,x2),maxX:Math.max(x1,x2),minZ:Math.min(z1,z2),maxZ:Math.max(z1,z2)})}
function box(mx1,my1,mx2,my2,y0,y1,mat,o={}){
  const x1=X(mx1),x2=X(mx2),z1=Z(my1),z2=Z(my2);
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),y1-y0,Math.abs(z2-z1)),mat);
  m.position.set((x1+x2)/2,(y0+y1)/2,(z1+z2)/2);scene.add(m);
  if(o.collide!==false)addCollider(x1,z1,x2,z2);
  if(o.cam!==false)camBlockers.push(m);
  return m;
}
const DIR={s:{r:0,n:[0,1]},n:{r:Math.PI,n:[0,-1]},e:{r:Math.PI/2,n:[1,0]},w:{r:-Math.PI/2,n:[-1,0]}};
function decal(mx,my,dir,w,h,yc,mat,off=0.012){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  const d=DIR[dir];p.position.set(X(mx)+d.n[0]*off,yc,Z(my)+d.n[1]*off);p.rotation.y=d.r;scene.add(p);return p;
}
// a canvas laid over a wall face; u(m) converts a plan coordinate along the wall to canvas x
function wallCanvas(dir,a,b,h=H){
  const [c,x]=cvs((b-a)*K,h*100);
  const u=(dir==='n'||dir==='e')?m=>(b-m)*K:m=>(m-a)*K;
  return {c,x,u,w:(b-a)*S,h};
}
function fitText(ctx,txt,max,size,weight,family){let s=size;do{ctx.font=`${weight} ${s}px ${family}`;s-=2}while(ctx.measureText(txt).width>max&&s>10)}
const SIGNF='"Barlow Condensed",sans-serif';
const basic=t=>new THREE.MeshBasicMaterial({map:tex(t),transparent:true});

// ---------- textures ----------
const [tc,tx]=cvs(1024,1024);
tx.fillStyle='#6a4545';tx.fillRect(0,0,1024,1024);
for(let i=0;i<2600;i++){tx.fillStyle=`rgba(${105+rnd()*50|0},${62+rnd()*34|0},${60+rnd()*30|0},.22)`;tx.beginPath();tx.arc(rnd()*1024,rnd()*1024,4+rnd()*14,0,7);tx.fill()}
const chips=['#efe4d2','#d8c2a6','#2a1b16','#a7624c','#5a3227','#c99b7f','#f6efe3','#8c8a84','#b3876a'];
for(let i=0;i<42000;i++){tx.fillStyle=chips[rnd()*chips.length|0];const s=.7+rnd()*2.4;tx.fillRect(rnd()*1024,rnd()*1024,s,s*(.6+rnd()*.8))}
const floorTex=tex(tc,true);floorTex.repeat.set(1/3.2,1/3.2);

const [cc,cx]=cvs(256,256);
cx.fillStyle='#ece9e2';cx.fillRect(0,0,256,256);
for(let i=0;i<2600;i++){cx.fillStyle=`rgba(120,112,100,${.08+rnd()*.18})`;cx.fillRect(rnd()*256,rnd()*256,1+rnd()*1.5,1+rnd()*1.5)}
cx.fillStyle='#c9c3b7';for(const p of [0,128]){cx.fillRect(p,0,3,256);cx.fillRect(0,p,256,3)}
const ceilTex=tex(cc,true);

const [wc,wx]=cvs(512,512);
wx.fillStyle='#c27f37';wx.fillRect(0,0,512,512);
wx.save();wx.translate(256,256);wx.rotate(-0.5);
for(let y=-520;y<520;){const h=14+rnd()*16;wx.fillStyle=['#c98a40','#b8732e','#d39448','#bd7b35','#c48237'][rnd()*5|0];wx.fillRect(-520,y,1040,h);wx.fillStyle='rgba(80,40,10,.35)';wx.fillRect(-520,y,1040,1.2);y+=h}
wx.restore();
const woodTex=tex(wc,true);

const [kc,kx]=cvs(256,256);
kx.fillStyle='#8b8a83';kx.fillRect(0,0,256,256);
for(let i=0;i<9000;i++){kx.fillStyle=`rgba(${rnd()<.5?'60,60,58':'175,174,166'},${.1+rnd()*.25})`;kx.fillRect(rnd()*256,rnd()*256,2+rnd()*6,1)}
const carpetTex=tex(kc,true);

const M={
  wall:std({color:0xeeead9,roughness:.92}),
  floor:std({map:floorTex,roughness:.24}),
  steel:std({color:0xb7babd,roughness:.35,metalness:.7}),
  dark:std({color:0x2a2d30,roughness:.6}),
  black:std({color:0x141414,roughness:.4}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe6ec,transparent:true,opacity:.22,roughness:.05,metalness:.2,side:THREE.DoubleSide,depthWrite:false}),
  light:new THREE.MeshBasicMaterial({color:0xfffdf3}),
  pit:std({color:0x6e5d53,roughness:.9}),
  bronze:std({color:0x4b4636,roughness:.55,metalness:.2}),

// ---------- measured hallway scale ----------
// User's straight spans: 5.5 and 15 avatar shoe lengths, widened another 15%.
// Shared dimensions keep the architecture calibrated to the visible avatar.
// The glass frontage is plan y=700, railing y=784, wood wall y=822.
const AVATAR_DIMENSIONS={scale:.92,shoeDepth:.38};
const HALL_MEASURE={shoeM:AVATAR_DIMENSIONS.shoeDepth*AVATAR_DIMENSIONS.scale,redShoes:5.5*1.15,greenShoes:15*1.15,glass:700,rail:784,wood:822};
const RAW_Z=m=>(m-800)*S;
const HALL_GLASS_Z=RAW_Z(HALL_MEASURE.glass);
const HALL_RAIL_Z=HALL_GLASS_Z+HALL_MEASURE.shoeM*HALL_MEASURE.redShoes;
const HALL_WOOD_Z=HALL_GLASS_Z+HALL_MEASURE.shoeM*HALL_MEASURE.greenShoes;
function measuredZ(m){
 if(m<=HALL_MEASURE.glass)return RAW_Z(m);
 if(m<=HALL_MEASURE.rail)return HALL_GLASS_Z+(m-HALL_MEASURE.glass)/(HALL_MEASURE.rail-HALL_MEASURE.glass)*(HALL_RAIL_Z-HALL_GLASS_Z);
 if(m<=HALL_MEASURE.wood)return HALL_RAIL_Z+(m-HALL_MEASURE.rail)/(HALL_MEASURE.wood-HALL_MEASURE.rail)*(HALL_WOOD_Z-HALL_RAIL_Z);
 return HALL_WOOD_Z+(m-HALL_MEASURE.wood)*S;
}
function planY(z){
 if(z<=HALL_GLASS_Z)return z/S+800;
 if(z<=HALL_RAIL_Z)return HALL_MEASURE.glass+(z-HALL_GLASS_Z)/(HALL_RAIL_Z-HALL_GLASS_Z)*(HALL_MEASURE.rail-HALL_MEASURE.glass);

 function flight(name,topX,dir,z){
  const group=new THREE.Group();group.name='main-escalator-'+name;
  group.userData={upper:topX,lower:topX+dir*shaftLength,z,drop};
  scene.add(group);
  const x=u=>topX+dir*u;
  const height=u=>-drop*THREE.MathUtils.clamp((u-landing)/slopeLength,0,1);
  function mesh(part,geometry,material,u,y,dz=0){
   const m=new THREE.Mesh(geometry,material);m.name=name+'-'+part;
   m.position.set(x(u),y,z+dz);group.add(m);return m;
  }
  function slab(part,a,b,y,w,h,mat,dz=0){
   return mesh(part,new THREE.BoxGeometry(b-a,h,w),mat,(a+b)/2,y,dz);
  }
  function segment(part,a,b,y1,y2,w,h,mat,dz=0){
   const m=mesh(part,new THREE.BoxGeometry(Math.hypot(b-a,y2-y1)+.025,h,w),mat,(a+b)/2,(y1+y2)/2,dz);
   m.rotation.z=Math.atan2(y2-y1,dir*(b-a));
  }
  const treadFaces=[rubber,rubber,treadSurface,rubber,rubber,rubber];
  // Flush plates end at the cutout. A raised comb covers the joint with the floor.
  slab('upper-landing-plate',0,landing,-.02,treadWidth,.04,stainless);
  slab('upper-sill',-.18,.065,.003,2*halfRail+.175,.018,stainless);
  slab('lower-landing-plate',shaftLength-landing,shaftLength+.29,-drop+.018,treadWidth,.037,stainless);
  for(const [comb,y] of [[landing-.07,.004],[shaftLength-landing+.03,-drop+.037]]){
   slab('comb-plate',comb-.07,comb+.07,y,treadWidth,.018,treadFaces);
   slab('comb-edge',comb-.012,comb+.012,y+.01,treadWidth,.008,yellow);
  }
  for(let i=0;i<stepCount;i++){
   const a=landing+i*treadDepth,b=a+treadDepth,u=(a+b)/2,y=-(i+1)*rise;
   const step=mesh('tread',new THREE.BoxGeometry(treadWidth,rise+.055,treadDepth+.002),treadFaces,u,y-(rise+.055)/2);
   step.rotation.y=dir*Math.PI/2;
   for(const side of [-1,1])slab('yellow-step-edge',a+.025,b-.025,y+.003,.022,.006,yellow,side*(treadWidth/2-.013));
  }
  segment('underside',landing,shaftLength-landing,-.32,-drop-.32,1.08,.41,innerSkirt);

  for(const side of [-1,1]){
   const offset=side*halfRail;
   slab('upper-side-deck',0,landing,-.065,.175,.13,stainless,offset);
   segment('sloped-side-deck',landing,shaftLength-landing,-.058,-drop-.058,.175,.19,stainless,offset);
   slab('lower-side-deck',shaftLength-landing,shaftLength+.38,-drop+.005,.175,.11,stainless,offset);

   const railPoints=[
    [-.35,.30],[-.30,.64],[-.16,.86],[.14,.96],[.58,.98],[landing-.19,.95],
    [landing+.30,height(landing+.30)+.96],
    [shaftLength-landing-.30,height(shaftLength-landing-.30)+.96],
    [shaftLength-landing+.19,-drop+.95],[shaftLength-.58,-drop+.97],
    [shaftLength-.04,-drop+.96],[shaftLength+.24,-drop+.83],[shaftLength+.39,-drop+.60],[shaftLength+.42,-drop+.30]
   ];
   const curve=new THREE.CatmullRomCurve3(railPoints.map(([u,y])=>new THREE.Vector3(x(u),y,z+offset)));
   const rail=new THREE.Mesh(new THREE.TubeGeometry(curve,86,.051,8,false),rubber);
   rail.name=name+'-rubber-handrail';group.add(rail);

   // The glass follows the handrail profile, with slim stainless trim beneath it.
   const profile=curve.getPoints(86);
   const positions=[];
   for(let i=1;i<profile.length;i++){
    const a=profile[i-1],b=profile[i],bottomA=height(dir*(a.x-topX))+.045,bottomB=height(dir*(b.x-topX))+.045;
    positions.push(a.x,bottomA,a.z,b.x,bottomB,b.z,b.x,b.y-.025,b.z,a.x,bottomA,a.z,b.x,b.y-.025,b.z,a.x,a.y-.025,a.z);
   }
   const panel=new THREE.BufferGeometry();panel.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));panel.computeVertexNormals();
   const balustrade=new THREE.Mesh(panel,glass);balustrade.name=name+'-glass-balustrade';group.add(balustrade);
   const trimCurve=new THREE.CatmullRomCurve3(profile.map(p=>new THREE.Vector3(p.x,p.y-.057,p.z)));
   const trim=new THREE.Mesh(new THREE.TubeGeometry(trimCurve,86,.035,7,false),stainless);
   trim.name=name+'-balustrade-trim';group.add(trim);
  }
 }

function triangulateMap(points){
 const p=points.map(a=>a.slice(0,2)),n=p.length;
 p.push([-10000,-10000],[20000,-10000],[0,20000]);let tris=[[n,n+1,n+2]];
 const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
 function contains(t,q){const [a,b,c]=t.map(i=>p[i]);
  const ax=a[0]-q[0],ay=a[1]-q[1],bx=b[0]-q[0],by=b[1]-q[1],cx=c[0]-q[0],cy=c[1]-q[1];
  const det=(ax*ax+ay*ay)*(bx*cy-by*cx)-(bx*bx+by*by)*(ax*cy-ay*cx)+(cx*cx+cy*cy)*(ax*by-ay*bx);
  return det*cross(a,b,c)>1e-6;}
 for(let i=0;i<n;i++){
  const bad=tris.filter(t=>contains(t,p[i])),edges=new Map();
  for(const t of bad)for(let j=0;j<3;j++){const a=t[j],b=t[(j+1)%3],key=[Math.min(a,b),Math.max(a,b)].join(':');if(edges.has(key))edges.delete(key);else edges.set(key,[a,b]);}
  tris=tris.filter(t=>!bad.includes(t));for(const [a,b] of edges.values())if(Math.abs(cross(p[a],p[b],p[i]))>1e-8)tris.push([a,b,i]);

  nav.len=len;
  const gap=.95,start=1.0,end=len-.5,flow=(t*1.3)%gap;let ci=0;
  for(let s=start+flow;s<end&&ci<chevs.length;s+=gap){
    let acc=0,k=0;while(k<seg.length-1&&acc+seg[k]<s){acc+=seg[k];k++}
    const u=Math.min(1,(s-acc)/seg[k]),a=path[k],b=path[k+1],dx=b[0]-a[0],dz=b[1]-a[1];
    const c=chevs[ci++];c.visible=true;c.position.set(a[0]+dx*u,.03,a[1]+dz*u);c.rotation.y=Math.atan2(-dz,dx);
    c.material.opacity=Math.min(1,(s-start)/1.0+.2,(end-s)/1.0+.35);
  }
  for(;ci<chevs.length;ci++)chevs[ci].visible=false;
  let ni=1;while(ni<path.length-1&&Math.hypot(path[ni][0]-P.x,path[ni][1]-P.z)<1.5)ni++;
  const nx=path[ni][0]-P.x,nz=path[ni][1]-P.z;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const ang=Math.atan2(nx*rx+nz*rz,nx*fx+nz*fz);
  $('rarrow').style.transform=`rotate(${ang*180/Math.PI}deg)`;$('rpath').setAttribute('d',ARROW);
  const toTurn=Math.max(1,Math.round(Math.hypot(nx,nz)));
  const last=ni===path.length-1;
  let step;
  if(Math.abs(ang)>2.4)step='Turn around';
  else if(last)step=Math.abs(ang)<.45?`${nav.room.say} straight ahead`:`${nav.room.say} on your ${ang>0?'right':'left'}`;
  else if(Math.abs(ang)<.45)step=`Go straight for ${toTurn} m`;
  else step=`Turn ${ang>0?'right':'left'}, then go ${toTurn} m`;
  $('rstep').textContent=step;$('rdist').textContent=`${Math.max(1,Math.round(len))} m`;
}

// ---------- loop ----------
const clock=new THREE.Clock();const ray=new THREE.Raycaster();const tgt=new THREE.Vector3(),dirV=new THREE.Vector3();
let camY=1.45;
function angLerp(a,b,t){const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}
function animLimbs(av,phase,amp,air){const s=Math.sin(phase)*amp;av.legL.rotation.x=s*.8;av.legR.rotation.x=-s*.8;av.armL.rotation.x=air?-2.6:-s*.8;av.armR.rotation.x=air?-2.6:s*.8}
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
  let r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  const mag=Math.min(1,Math.hypot(f,r));
  const run=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>.95);
  const sp=(run?7.2:4.2)*mag;
  if(mag>.05){
    const n=Math.hypot(f,r);f/=n;r/=n;
    const vx=-Math.sin(yaw)*f+Math.cos(yaw)*r, vz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
    moveP(vx*sp*dt,vz*sp*dt);
    P.face=angLerp(P.face,Math.atan2(vx,vz),Math.min(1,dt*12));
  }
  if((keys.Space||jumpQueued)&&P.grounded){P.vy=6.6;P.grounded=false}
  jumpQueued=false;
  P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.grounded=true}
  P.amp+=((mag>.05?1:0)-P.amp)*Math.min(1,dt*10);P.phase+=dt*(run?13:9)*Math.max(mag,.2);
  player.g.position.set(P.x,P.y,P.z);player.g.rotation.y=P.face;
  player.sh.position.set(P.x,.015,P.z);player.sh.scale.setScalar(1-Math.min(P.y,1.5)*.3);
  animLimbs(player,P.phase,P.amp,!P.grounded);

  camY+=((P.y+(photoEyeHeight||1.45))-camY)*Math.min(1,dt*10);
  tgt.set(P.x,camY,P.z);
  dirV.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).normalize();
  if(photoEyeHeight){
   camera.position.copy(tgt);camera.position.y=Math.min(camera.position.y,H-.12);
   camera.lookAt(camera.position.x-dirV.x,camera.position.y-dirV.y,camera.position.z-dirV.z);
   player.g.visible=false;
  }else{
   ray.set(tgt,dirV);ray.far=dist+.3;
   const hits=ray.intersectObjects(camBlockers,false);
   const want=hits.length?Math.max(.45,Math.min(dist,hits[0].distance-.3)):dist;
   camDist=want<camDist?want:camDist+(want-camDist)*Math.min(1,dt*4);
   camera.position.copy(tgt).addScaledVector(dirV,camDist);
   camera.position.y=Math.min(H-.12,Math.max(.25,camera.position.y));
   camera.lookAt(tgt);
   player.g.visible=camDist>.75;
  }
  const zn=zoneAt();if(zn!==lastZone){lastZone=zn;zoneEl.textContent=zn}
  updateNav();drawMini();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
el.focus();
tick();
})();
</script>
