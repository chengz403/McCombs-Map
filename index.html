<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CBA Sixth Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas with a thin HUD layer floating at the corners */
:root{
  --bg:#1a1411;
  --panel:rgba(26,20,17,.80);
  --ink:#f6efe6;
  --muted:#cdbba8;
  --accent:#e8702a;
  --line:rgba(255,255,255,.14);
  --font-ui:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-sign:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font-ui)}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none;outline:none}
.hud-left{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 240px));pointer-events:none}
.hud-zone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 9px;display:flex;flex-direction:column;gap:2px;
  backdrop-filter:blur(6px);pointer-events:none}
.finder{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(6px);pointer-events:auto;margin:0}
.finder label{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finder-row{display:flex;gap:6px}
.finder input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 15px var(--font-ui);padding:8px 10px}
.finder input::placeholder{color:rgba(205,187,168,.7)}
.finder input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.finder select{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 14px var(--font-ui);padding:8px 8px}
.finder select option{background:#2a211c;color:var(--ink)}
.finder select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease-out}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;font:700 14px var(--font-ui);padding:0 16px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);padding:7px 12px;font-weight:500;align-self:flex-start}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.msg{font-size:13px;color:#ffb08a;line-height:1.4}
.route{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-dest{font-weight:700;font-size:15px}
.route-sub{font-size:12px;color:var(--muted)}
.route-dist{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap}
.route-step{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3}
.turn{width:36px;height:36px;border-radius:9px;background:rgba(232,112,42,.18);display:grid;place-items:center;flex:none}
.turn svg{width:22px;height:22px;transition:transform .15s linear}
@media (prefers-reduced-motion:reduce){.turn svg{transition:none}}
.eyebrow{font-family:var(--font-sign);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#zone{font-size:15px;font-weight:500;line-height:1.25}
.mini-wrap{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;pointer-events:none}
#mini{display:block;width:200px;height:auto;border-radius:5px}
.mini-cap{font-family:var(--font-sign);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:5px 2px 0;display:flex;justify-content:space-between}
.mini-cap b{color:#e8473b;font-weight:600}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:none;max-width:calc(100vw - 32px)}
.hint span{white-space:nowrap}
kbd{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-right:4px}
.stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(26,20,17,.45);border:2px solid rgba(255,255,255,.25);touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(246,239,230,.85);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.jump{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);background:var(--accent);color:#fff;font:700 15px var(--font-ui);touch-action:none}
.jump:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:640px){
  #mini{width:130px}
  .hud-left{width:calc(100vw - 175px)}
  #zone{font-size:13px}
}
</style>
</head>
<body>
<div id="game" aria-label="3D walkable model of the CBA sixth floor and walkway"></div>
<div class="hud-left">
  <header class="hud-zone"><span class="eyebrow">McCombs · CBA Level 6</span><strong id="zone">Atrium overlook</strong></header>
  <form class="finder" id="finder" autocomplete="off">
    <label for="room">Find a room</label>
    <div class="finder-row"><input id="room" name="room" placeholder="6.492, 6.420 or elevator" inputmode="decimal" enterkeyhint="go"><button class="btn" type="submit">Go</button></div>
    <div class="msg" id="msg" role="status" hidden></div>
    <div class="route" id="route" hidden>
      <div class="route-head"><div><div class="route-dest" id="rdest">CBA 6.420</div><div class="route-sub" id="rsub">Conference room</div></div><span class="route-dist" id="rdist">0 m</span></div>
      <div class="route-step"><span class="turn"><svg viewBox="0 0 24 24" id="rarrow" aria-hidden="true"><path id="rpath" d="M12 3l7 8h-4.5v10h-5V11H5z" fill="#e8702a"/></svg></span><span id="rstep" aria-live="polite">Follow the arrows on the floor</span></div>
      <button class="btn ghost" type="button" id="rcancel">End directions</button>
    </div>
  </form>
  <form class="finder" id="spawn" autocomplete="off">
    <label for="entrance">Start at an entrance</label>
    <div class="finder-row"><select id="entrance"></select><button class="btn" type="submit">Teleport</button></div>
  </form>
</div>
<div class="flash" id="flash"></div>
<div class="mini-wrap"><canvas id="mini" aria-label="Floor map with your position"></canvas><div class="mini-cap"><span>Level 6 · ← North</span><b>● You</b></div></div>
<div class="hint" id="hint"><span><kbd>WASD</kbd>move</span><span><kbd>Drag</kbd>look</span><span><kbd>Space</kbd>jump</span><span><kbd>Shift</kbd>run</span><span><kbd>Scroll</kbd>zoom</span></div>
<div id="stick" class="stick" hidden><div class="knob" id="knob"></div></div>
<button id="jump" class="jump" type="button" hidden>Jump</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
"use strict";
// Coordinates are pixels on the CBA 6th floor plan (1542×956). 0.045 m per pixel.
// The walkway plan has its own pixel grid (u,v); wu/wv place it west of the CBA North opening.
const S=0.045, H=2.75;
const X=m=>(m-770)*S, Z=m=>(m-480)*S;
const K=0.644, wu=u=>8+(u-1660)*K, wv=v=>525+(v-375)*K;

try{
  await Promise.race([
    Promise.all(['600 40px "Barlow Condensed"','700 40px "Barlow Condensed"','400 40px Rubik','700 40px Rubik'].map(f=>document.fonts.load(f))),
    new Promise(r=>setTimeout(r,2500))
  ]);
}catch(e){}

// ---------- renderer ----------
const wrap=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.domElement.tabIndex=0;
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd9d6cf);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.05,260);
const ANISO=renderer.capabilities.getMaxAnisotropy();

// ---------- helpers ----------
let seed=11;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
const std=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o));
const colliders=[], camBlockers=[], segs=[];
function addCollider(x1,z1,x2,z2){colliders.push({minX:Math.min(x1,x2),maxX:Math.max(x1,x2),minZ:Math.min(z1,z2),maxZ:Math.max(z1,z2)})}
function boxM(x1,z1,x2,z2,y0,y1,mat,o={}){ // meters
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),y1-y0,Math.abs(z2-z1)),mat);
  m.position.set((x1+x2)/2,(y0+y1)/2,(z1+z2)/2);scene.add(m);
  if(o.collide!==false)addCollider(x1,z1,x2,z2);
  if(o.cam!==false)camBlockers.push(m);
  return m;
}
const box=(a,b,c,d,y0,y1,mat,o)=>boxM(X(a),Z(b),X(c),Z(d),y0,y1,mat,o);
const DIR={s:{r:0,n:[0,1]},n:{r:Math.PI,n:[0,-1]},e:{r:Math.PI/2,n:[1,0]},w:{r:-Math.PI/2,n:[-1,0]}};
function decalM(x,z,dir,w,h,yc,mat,off=0.012){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  const d=DIR[dir];p.position.set(x+d.n[0]*off,yc,z+d.n[1]*off);p.rotation.y=d.r;scene.add(p);return p;
}
const decal=(mx,my,dir,w,h,yc,mat,off)=>decalM(X(mx),Z(my),dir,w,h,yc,mat,off);
function fitText(ctx,txt,max,size,weight,family){let s=size;do{ctx.font=`${weight} ${s}px ${family}`;s-=2}while(ctx.measureText(txt).width>max&&s>10);}
const SIGNF='"Barlow Condensed",sans-serif', UIF='Rubik,sans-serif';
const inR=(r,x,y)=>x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3];

// ---------- textures (from the photos) ----------
// glossy speckled vinyl tile, 12" squares
const [fc,fx]=cvs(512,512);
for(let i=0;i<4;i++)for(let j=0;j<4;j++){const v=226+rnd()*10|0;fx.fillStyle=`rgb(${v},${v},${v-2})`;fx.fillRect(i*128,j*128,128,128)}
for(let i=0;i<9000;i++){const g=120+rnd()*90|0;fx.fillStyle=`rgba(${g},${g},${g},${.25+rnd()*.5})`;const s=.8+rnd()*2.2;fx.fillRect(rnd()*512,rnd()*512,s,s*(.5+rnd()))}
fx.fillStyle='rgba(150,150,145,.55)';for(let p=0;p<=512;p+=128){fx.fillRect(p-1,0,2,512);fx.fillRect(0,p-1,512,2)}
const vctTex=tex(fc,true);vctTex.repeat.set(1/1.22,1/1.22);
// taupe loop carpet
const [kc,kx]=cvs(256,256);kx.fillStyle='#9d9287';kx.fillRect(0,0,256,256);
for(let i=0;i<14000;i++){const g=rnd();kx.fillStyle=g<.5?'rgba(70,62,56,.35)':g<.8?'rgba(200,190,178,.35)':'rgba(120,96,86,.3)';kx.fillRect(rnd()*256,rnd()*256,1.4,1.4)}
const carpetTex=tex(kc,true);carpetTex.repeat.set(1/1.4,1/1.4);
// walkway: pale polished terrazzo
const [tc,tx]=cvs(512,512);tx.fillStyle='#cfc8bd';tx.fillRect(0,0,512,512);
const chips=['#f2ede4','#a99f92','#7c7268','#e4dccf','#8f9a9c','#5f5852'];
for(let i=0;i<22000;i++){tx.fillStyle=chips[rnd()*chips.length|0];const s=.7+rnd()*2.2;tx.fillRect(rnd()*512,rnd()*512,s,s*(.6+rnd()*.8))}
const terrTex=tex(tc,true);terrTex.repeat.set(1/2.4,1/2.4);
// walkway: dark speckled terrazzo with divider strips, polished (video)
const [dc,dx]=cvs(512,512);dx.fillStyle='#4b423e';dx.fillRect(0,0,512,512);
for(let i=0;i<900;i++){dx.fillStyle=`rgba(${60+rnd()*40|0},${50+rnd()*30|0},${46+rnd()*26|0},.35)`;dx.beginPath();dx.arc(rnd()*512,rnd()*512,3+rnd()*9,0,7);dx.fill()}
const dchips=['#a9a39b','#7d756e','#2a2523','#8a6448','#5e5650','#1d1a19','#6b5e56','#c4beb5'];
for(let i=0;i<26000;i++){dx.fillStyle=dchips[rnd()*dchips.length|0];const z=.4+rnd()*1.1;dx.fillRect(rnd()*512,rnd()*512,z,z*(.6+rnd()*.8))}
dx.fillStyle='#8f8a84';dx.fillRect(0,0,512,2);
const dterrTex=tex(dc,true);dterrTex.repeat.set(1/1.7,1/1.7);
// 2'×4' acoustic ceiling tiles
const [cc,cx]=cvs(256,512);cx.fillStyle='#efede8';cx.fillRect(0,0,256,512);
for(let i=0;i<5200;i++){cx.fillStyle=`rgba(110,104,96,${.12+rnd()*.3})`;const s=.8+rnd()*1.8;cx.fillRect(rnd()*256,rnd()*512,s,s)}
cx.fillStyle='#d2cec6';cx.fillRect(0,0,4,512);cx.fillRect(0,0,256,4);
const ceilTex=tex(cc,true);ceilTex.repeat.set(1/0.61,1/1.22);
// painted walls with a black rubber base (cream wing) and a fabric-wrapped panel wall with a brown base (suite)
function wallTex(top,base,noise){
  const [c,x]=cvs(64,512);x.fillStyle=top;x.fillRect(0,0,64,512);
  if(noise)for(let i=0;i<900;i++){x.fillStyle=`rgba(0,0,0,${rnd()*.05})`;x.fillRect(rnd()*64,rnd()*512,1,1)}
  const g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,'rgba(255,255,255,.05)');g.addColorStop(1,'rgba(0,0,0,.03)');x.fillStyle=g;x.fillRect(0,0,64,480);
  x.fillStyle=base;x.fillRect(0,512-19,64,19);x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,512-19,64,1);
  return tex(c);
}
// door leaves: oak with cathedral grain in black hollow-metal frames, like 6.492
function doorTex(kind){
  const [c,x]=cvs(256,512);
  const frame=kind==='suite'?'#3b2c25':'#17181a';
  x.fillStyle=frame;x.fillRect(0,0,256,512);
  const lx=14,ly=14,lw=228,lh=498;
  if(kind==='steel'||kind==='plain'){x.fillStyle=kind==='steel'?'#8c9196':'#e9e5dc';x.fillRect(lx,ly,lw,lh);
    if(kind==='steel'){x.fillStyle='#2a2e33';x.fillRect(150,60,40,150);x.fillStyle='#9fb3bd';x.fillRect(155,65,30,140)}}
  else if(kind==='elev'){
    const g=x.createLinearGradient(lx,0,lx+lw,0);g.addColorStop(0,'#a9adb1');g.addColorStop(.5,'#d9dcdf');g.addColorStop(1,'#a2a6aa');
    x.fillStyle=g;x.fillRect(lx,ly,lw,lh);for(let i=0;i<180;i++){x.fillStyle=`rgba(255,255,255,${rnd()*.12})`;x.fillRect(lx,ly+rnd()*lh,lw,1)}
    x.fillStyle='#55595e';x.fillRect(127,ly,3,lh);
  }else{
    const base=kind==='suite'?[196,132,58]:kind==='tan'?[190,172,112]:[214,168,118];
    x.fillStyle=`rgb(${base})`;x.fillRect(lx,ly,lw,lh);
    for(let i=0;i<260;i++){const xx=lx+rnd()*lw;x.fillStyle=`rgba(120,70,30,${.05+rnd()*.12})`;x.fillRect(xx,ly,1+rnd()*1.5,lh)}
    if(kind==='oak'){x.lineWidth=1.6;for(let k=0;k<3;k++){const cxk=lx+40+k*76;for(let j=0;j<9;j++){x.strokeStyle=`rgba(140,85,40,${.25+rnd()*.2})`;x.beginPath();const y0=60+j*52+rnd()*10;x.moveTo(cxk-22,y0+50);x.quadraticCurveTo(cxk,y0-30,cxk+22,y0+50);x.stroke()}}}
    else{const g=x.createLinearGradient(lx,0,lx+lw,0);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.08)');x.fillStyle=g;x.fillRect(lx,ly,lw,lh)}
  }
  if(kind!=='elev'){
    const hw=kind==='suite'?'#c9a45a':'#6f5a3c';
    x.fillStyle=hw;x.beginPath();x.arc(46,236,7,0,7);x.fill();
    x.beginPath();x.arc(46,272,9,0,7);x.fill();x.fillRect(42,266,46,11);
  }
  return tex(c);
}
// ADA room plaque: black upper panel with the number, grey insert below
function plaqueTex(num,sub){
  const [c,x]=cvs(128,192);
  x.fillStyle='#bfc2c5';x.fillRect(0,0,128,192);
  x.fillStyle='#111214';x.fillRect(0,0,128,124);
  x.fillStyle='#f4f1ea';fitText(x,num,108,40,500,'Georgia,serif');x.fillText(num,12,60);
  x.fillStyle='#8d9094';x.font='600 12px sans-serif';x.fillText('⠼⠋⠲'+(num.replace(/\D/g,'').slice(-3)),12,84);
  if(sub){x.fillStyle='#cfd1d3';fitText(x,sub,108,15,500,UIF);x.fillText(sub,12,108)}
  x.fillStyle='#d3d5d8';x.fillRect(6,132,116,54);
  return tex(c);
}
function signTex(top,sub,col='#bf5700'){
  const [c,x]=cvs(640,160);
  x.fillStyle='#2f3236';x.fillRect(0,0,640,160);
  x.fillStyle=col;x.fillRect(0,0,12,160);
  x.fillStyle='#fff';x.textBaseline='middle';
  if(sub){fitText(x,top,590,64,700,SIGNF);x.fillText(top,34,58);x.fillStyle='#d4d6d8';fitText(x,sub,590,38,500,SIGNF);x.fillText(sub,34,118)}
  else{fitText(x,top,590,80,700,SIGNF);x.fillText(top,34,82)}
  return tex(c);
}

// ---------- materials ----------
const M={
  cream:std({map:wallTex('#e3d8c1','#141414',true),roughness:.45}),
  grey:std({map:wallTex('#c9c8cf','#3a2c26',true),roughness:.95}),
  plain:std({color:0xe8e3d6,roughness:.6}),
  vct:std({map:vctTex,roughness:.16,metalness:.02}),
  carpet:std({map:carpetTex,roughness:1}),
  terr:std({map:terrTex,roughness:.22}),
  dterr:std({map:dterrTex,roughness:.1,metalness:.05}),
  white:std({map:wallTex('#eceae4','#151515',true),roughness:.5}),
  copper:std({color:0xb5774f,roughness:.8}),
  green:std({color:0x4c6156,roughness:.95}),
  ceil:std({map:ceilTex,roughness:1,side:THREE.DoubleSide}),
  steel:std({color:0xb7babd,roughness:.35,metalness:.7}),
  dark:std({color:0x2a2d30,roughness:.6}),
  black:std({color:0x141414,roughness:.45}),
  bronze:std({color:0x2e2620,roughness:.4,metalness:.4}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe6ec,transparent:true,opacity:.2,roughness:.05,metalness:.2,side:THREE.DoubleSide,depthWrite:false}),
  light:new THREE.MeshBasicMaterial({color:0xfffdf6}),
  pit:std({color:0x8a8178,roughness:.9}),
  wood:std({color:0x9a6a3e,roughness:.6}),
  red:std({color:0xb3221c,roughness:.5}),
};
M.copper.color.convertSRGBToLinear();M.green.color.convertSRGBToLinear();
const doorMats={};for(const k of ['oak','suite','steel','plain','elev','tan'])doorMats[k]=new THREE.MeshStandardMaterial({map:doorTex(k),roughness:.5});

const cellPos=(i,j)=>[X(GX0+(i+.5)*CS),Z(GY0+(j+.5)*CS)];

function astar(start,goal){

  const S0=sj*CW+si,G=gj*CW+gi;gScore.fill(Infinity);closed.fill(0);came.fill(-1);
  const heap=[];const push=(f,n)=>{heap.push([f,n]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};

  while(heap.length){const [,u]=pop();if(closed[u])continue;closed[u]=1;if(u===G)break;const ui=u%CW,uj=u/CW|0;
    for(const [di,dj,c] of nb){const a=ui+di,b=uj+dj;if(a<0||b<0||a>=CW||b>=CHh)continue;const v=b*CW+a;if(!walk[v]||closed[v])continue;

}

teleport('atrium',true);
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
  let r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  const mag=Math.min(1,Math.hypot(f,r));
  const run=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>.95);
  const sp=(run?7.2:4.2)*mag;
  if(mag>.05){
    const n=Math.hypot(f,r);f/=n;r/=n;
    const vx=-Math.sin(yaw)*f+Math.cos(yaw)*r, vz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
    moveP(vx*sp*dt,vz*sp*dt);
    P.face=angLerp(P.face,Math.atan2(vx,vz),Math.min(1,dt*12));
  }
  if((keys.Space||jumpQueued)&&P.grounded){P.vy=6.2;P.grounded=false}
  jumpQueued=false;
  P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.grounded=true}
  P.amp+=((mag>.05?1:0)-P.amp)*Math.min(1,dt*10);P.phase+=dt*(run?13:9)*Math.max(mag,.2);
  player.g.position.set(P.x,P.y,P.z);player.g.rotation.y=P.face;
  player.sh.position.set(P.x,.015,P.z);player.sh.scale.setScalar(1-Math.min(P.y,1.5)*.3);
  animLimbs(player,P.phase,P.amp,!P.grounded);
  updateWalkers(dt);
  for(const s of stepTexes)s.t.offset.y=(s.t.offset.y+s.dir*dt*.6)%1;
  camY+=((P.y+1.45)-camY)*Math.min(1,dt*10);
  tgt.set(P.x,camY,P.z);
  dirV.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).normalize();
  ray.set(tgt,dirV);ray.far=dist+.3;
  const hits=ray.intersectObjects(camBlockers,false);
  const want=hits.length?Math.max(.4,Math.min(dist,hits[0].distance-.25)):dist;
  camDist=want<camDist?want:camDist+(want-camDist)*Math.min(1,dt*4);
  camera.position.copy(tgt).addScaledVector(dirV,camDist);
  const ceilY=P.x<X(8)?H+.35:H;
  camera.position.y=Math.min(ceilY-.12,Math.max(.25,camera.position.y));
  camera.lookAt(tgt);
  player.g.visible=camDist>.7;
  const zn=zoneAt();if(zn!==lastZone){lastZone=zn;zoneEl.textContent=zn}
  updateNav();
  drawMini();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
el.focus();
tick();
})();
</script>
